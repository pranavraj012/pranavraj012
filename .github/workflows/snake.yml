name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *" # regenerate daily at midnight UTC
  workflow_dispatch: # allow manual trigger from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: pranavraj012
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2336BCF7&color_dots=%23ebedf0,%239be9a8,%2340c463,%230a6d32,%230e4429
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2336BCF7&color_dots=%2316161b,%230e4429,%23006d32,%2326a641,%2339d353

      - name: Push snake to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
